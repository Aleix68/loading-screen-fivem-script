<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO//RP | Loading</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="noise"></div>
    <main class="shell">
        <header class="topbar">
            <a class="brand" href="#" aria-label="GO Roleplay"><span class="brand-mark">GO</span><span class="brand-slash">//</span><span>RP</span></a>
            <div class="server-status"><span class="status-dot"></span><span id="connectionText"></span></div>
            <span class="version">LOS SANTOS <b>•</b> GO//RP</span>
        </header>
        <section class="hero" id="heroSection">
            <div class="hero-copy">
                <p class="eyebrow"><span class="eyebrow-line"></span><span id="eyebrowText"></span></p>
                <h1 id="heroTitle"></h1>
                <p class="intro" id="heroIntro"></p>
                <div class="loader-panel">
                    <div class="loader-heading"><span id="loadingLabel"></span><strong id="progressValue">0%</strong></div>
                    <div class="progress-track"><div id="progressBar" class="progress-bar"></div><span class="progress-glow"></span></div>
                    <div class="loader-meta"><span id="loadingDetail"></span><span class="loader-state">LIVE <i></i></span></div>
                </div>
            </div>
            <div class="visual-wrap">
                <div class="visual-index"><span id="imageIndex">01</span><span class="index-divider"></span><span>03</span></div>
                <div class="image-frame"><img id="mainImage" class="main-image"><div class="image-shade"></div><div class="image-caption"><span id="archivesLabel"></span><strong id="imageTitle"></strong></div></div>
                <div class="image-dots" id="imageDots"></div>
            </div>
        </section>
        <footer class="bottom-bar">
            <div class="tip"><span class="tip-label" id="tipLabel"></span><span id="tipText"></span></div>
            <div class="player">
                <div class="track-info"><span class="music-bars"><i></i><i></i><i></i><i></i></span><div><small id="nowPlayingLabel"></small><span id="songTitle"></span></div></div>
                <div class="player-controls"><button id="prevButton" type="button">&#9664;&#9664;</button><button id="playButton" class="play-button" type="button">&#9654;</button><button id="nextButton" type="button">&#9654;&#9654;</button></div>
                <label class="volume-control"><span id="volumeLabel"></span><input type="range" id="volume" min="0" max="1" step="0.01" value="0.45"></label>
            </div>
        </footer>
    </main>
    <audio id="audioPlayer" preload="none"></audio>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
